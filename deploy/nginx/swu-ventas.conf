# Nginx site configuration for SWU Marketplace.
#
# Install as /etc/nginx/sites-available/swu-ventas, enable it from
# /etc/nginx/sites-enabled, and replace the domain names if necessary.
# This file intentionally starts as HTTP-only so `certbot --nginx` can load
# the Nginx configuration before the first certificates exist. Certbot will
# add the HTTPS listeners, certificate paths, and HTTP-to-HTTPS redirects.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream ackbar_web {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream ackbar_api {
    server 127.0.0.1:4001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ackb.ar www.ackb.ar;

    client_max_body_size 2m;

    location / {
        proxy_pass http://ackbar_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ackb.ar;

    client_max_body_size 2m;

    location / {
        proxy_pass http://ackbar_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
